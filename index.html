<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Cofre · Painel</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e5e7eb; }
  main { max-width: 640px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 1.5rem; }
  .cartao { background: #16213a; border-radius: 16px; padding: 16px; margin: 12px 0; }
  label { display: block; font-size: .9rem; color: #9ca3af; }
  input { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0 12px; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: #e5e7eb; font-size: 1rem; }
  button { padding: 12px 16px; margin: 4px 8px 4px 0; border: 0; border-radius: 10px; background: #4ade80; color: #052e16; font-weight: 600; font-size: 1rem; }
  button.sec { background: #1e3a5f; color: #e5e7eb; }
  button.perigo { background: #f87171; color: #450a0a; }
  button:disabled { opacity: .5; }
  .aviso { color: #fbbf24; } .erro { color: #f87171; } .ok { color: #4ade80; }
  .mono { font-family: ui-monospace, monospace; word-break: break-all; }
  small { color: #9ca3af; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
  getAuth, setPersistence, browserSessionPersistence,
  signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {
  getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc,
  onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBtufw1kTj6b-8zurdBFtbdVuMGOCCOsxs",
  authDomain: "cofre-f8dc5.firebaseapp.com",
  projectId: "cofre-f8dc5",
  appId: "1:1055406605843:web:e7ec607be53ff93e58a1e6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
await setPersistence(auth, browserSessionPersistence);

const raiz = document.getElementById("app");
let ocioso = null;

function h(tag, props = {}, ...filhos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else el.setAttribute(k, v);
  }
  for (const f of filhos) el.append(f);
  return el;
}

function mostrar(...nos) {
  raiz.replaceChildren(...nos);
}

function reiniciarOcioso() {
  clearTimeout(ocioso);
  ocioso = setTimeout(() => signOut(auth), 5 * 60 * 1000);
}
["click", "keydown", "touchstart"].forEach((ev) => addEventListener(ev, () => {
  if (auth.currentUser) reiniciarOcioso();
}));

function telaLogin(mensagem) {
  const email = h("input", { type: "email", autocomplete: "username" });
  const senha = h("input", { type: "password", autocomplete: "current-password" });
  const aviso = h("p", { class: "erro" }, mensagem || "");
  const botao = h("button", {}, "Entrar");
  botao.onclick = async () => {
    botao.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, email.value.trim(), senha.value);
    } catch (e) {
      aviso.textContent = "Não foi possível entrar. Confira e-mail e senha.";
      botao.disabled = false;
    }
  };
  mostrar(
    h("h1", {}, "Cofre · Painel"),
    h("div", { class: "cartao" },
      h("label", {}, "E-mail"), email,
      h("label", {}, "Senha"), senha,
      botao, aviso)
  );
}

function quando(ts) {
  return ts && ts.toDate ? ts.toDate().toLocaleString("pt-BR") : "sem registro";
}

async function lerEstado(id) {
  try {
    const snap = await getDoc(doc(db, "dispositivos", id, "estado", "atual"));
    return snap.exists() ? snap.data() : {};
  } catch (e) {
    return {};
  }
}

function hex(bytes) {
  return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
}

async function calcularProva(senha, saltB64, desafio, idComando) {
  const enc = new TextEncoder();
  const sal = Uint8Array.from(atob(saltB64), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: sal, iterations: 210000, hash: "SHA-256" }, base, 256);
  const chave = await crypto.subtle.importKey(
    "raw", bits, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const assinatura = await crypto.subtle.sign(
    "HMAC", chave, enc.encode(desafio + "|" + idComando + "|apagar"));
  return hex(new Uint8Array(assinatura));
}

function mostrarResultado(c, status) {
  status.replaceChildren();
  status.className = c.status === "executado" ? "ok" : "erro";
  const r = String(c.resultado || c.status);
  if (c.status === "executado" && r.startsWith("loc:")) {
    const [lat, lng, prec, min] = r.slice(4).split(",").map(Number);
    if (Number.isFinite(lat) && Number.isFinite(lng)) {
      const link = h("a", {
        href: "https://www.google.com/maps?q=" + lat + "," + lng,
        target: "_blank",
        rel: "noopener noreferrer",
        style: "color:#4ade80"
      }, "Abrir no mapa");
      status.append("Localização (precisão ~" + prec + " m, há " + min + " min): ", link);
      return;
    }
  }
  status.append(r);
}

function acompanhar(ref, status) {
  status.className = "aviso";
  status.textContent = "Comando enviado. Aguardando o aparelho…";
  let temporizador = null;
  let parar = () => {};
  parar = onSnapshot(ref, (snap) => {
    const c = snap.data();
    if (!c || c.status === "pendente") return;
    parar();
    if (temporizador) clearTimeout(temporizador);
    mostrarResultado(c, status);
  });
  temporizador = setTimeout(() => {
    parar();
    status.className = "erro";
    status.textContent = "Sem resposta. O aparelho está ligado, com internet e recebendo comandos?";
  }, 120000);
}

async function enviar(deviceId, tipo, status) {
  try {
    const ref = doc(collection(db, "dispositivos", deviceId, "comandos"));
    await setDoc(ref, { tipo, status: "pendente", criadoEm: serverTimestamp() });
    acompanhar(ref, status);
  } catch (e) {
    status.className = "erro";
    status.textContent = "Não foi possível enviar o comando. Confira as regras do Firestore.";
  }
}

function botao(texto, aoClicar, classe) {
  const b = h("button", classe ? { class: classe } : {}, texto);
  b.onclick = aoClicar;
  return b;
}

async function cartaoAparelho(d, caixa) {
  const dados = d.data();
  const est = await lerEstado(d.id);
  const status = h("p", {}, "");

  const form = h("div", { class: "cartao" });
  form.hidden = true;
  const senhaCmd = h("input", { type: "password", autocomplete: "off" });
  const digitado = h("input", { autocomplete: "off", placeholder: "APAGAR" });
  const confirmar = h("button", { class: "perigo" }, "Apagar este aparelho agora");
  confirmar.onclick = async () => {
    status.className = "erro";
    if (digitado.value.trim() !== "APAGAR") {
      status.textContent = "Digite APAGAR para confirmar.";
      return;
    }
    const atual = await lerEstado(d.id);
    if (!atual.apagarHabilitado) {
      status.textContent = "O apagamento remoto não está habilitado neste aparelho.";
      return;
    }
    if (!atual.saltComando || !atual.desafio) {
      status.textContent = "O aparelho ainda não publicou os dados do desafio. Tente de novo em instantes.";
      return;
    }
    if (!senhaCmd.value) {
      status.textContent = "Digite a senha de comando.";
      return;
    }
    try {
      const ref = doc(collection(db, "dispositivos", d.id, "comandos"));
      const prova = await calcularProva(senhaCmd.value, atual.saltComando, atual.desafio, ref.id);
      senhaCmd.value = "";
      digitado.value = "";
      await setDoc(ref, {
        tipo: "apagar",
        status: "pendente",
        criadoEm: serverTimestamp(),
        desafio: atual.desafio,
        prova
      });
      form.hidden = true;
      acompanhar(ref, status);
    } catch (e) {
      status.textContent = "Não foi possível enviar o comando.";
    }
  };
  form.append(
    h("p", { class: "erro" }, "Isto apaga TODOS os dados do aparelho, sem volta."),
    h("label", {}, "Senha de comando"), senhaCmd,
    h("label", {}, "Digite APAGAR para confirmar"), digitado,
    confirmar
  );

  const apagar = botao("Apagar aparelho…", () => { form.hidden = !form.hidden; }, "perigo");
  const remover = botao("Remover do painel", async () => {
    if (!confirm("Remover este aparelho do painel?")) return;
    try { await deleteDoc(doc(db, "dispositivos", d.id, "estado", "atual")); } catch (e) {}
    await deleteDoc(doc(db, "dispositivos", d.id));
    carregarLista(caixa);
  }, "sec");

  const apagarTexto = est.apagarHabilitado
    ? "Apagamento remoto: habilitado no aparelho"
    : "Apagamento remoto: desligado no aparelho";

  return h("div", { class: "cartao" },
    h("strong", {}, dados.nome || "Aparelho"),
    h("div", {}, h("small", {},
      "ID " + d.id.slice(0, 8) + " · Android " + (est.android || "?") +
      " · último contato: " + quando(est.ultimoContato))),
    h("div", {}, h("small", {},
      "Localização: " + (est.localizacaoPermitida ? "permitida" : "não permitida") + " · " + apagarTexto)),
    h("div", {},
      botao("Bloquear cofre", () => enviar(d.id, "bloquear", status)),
      botao("Encerrar sessões", () => enviar(d.id, "encerrar", status)),
      botao("Localizar", () => enviar(d.id, "localizar", status)),
      botao("Pedir backup", () => enviar(d.id, "pedir_backup", status))),
    h("div", {}, apagar, remover),
    form,
    status
  );
}

async function carregarLista(caixa) {
  caixa.replaceChildren(h("small", {}, "Carregando…"));
  try {
    const snap = await getDocs(collection(db, "dispositivos"));
    if (snap.empty) {
      caixa.replaceChildren(h("small", {}, "Nenhum aparelho vinculado."));
      return;
    }
    const itens = [];
    for (const d of snap.docs) itens.push(await cartaoAparelho(d, caixa));
    caixa.replaceChildren(...itens);
  } catch (e) {
    caixa.replaceChildren(h("p", { class: "erro" }, "Não foi possível carregar. Confira as regras do Firestore."));
  }
}

function telaPainel(user) {
  const aviso = h("p", {}, "");
  const caixa = h("div", {});
  const codigo = h("input", { autocomplete: "off", placeholder: "ABCD-EFGH" });
  const vincular = h("button", {}, "Vincular aparelho");
  const atualizar = h("button", { class: "sec" }, "Atualizar lista");
  const sair = h("button", { class: "sec" }, "Sair");

  vincular.onclick = async () => {
    const c = codigo.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    aviso.className = "erro";
    if (c.length !== 8) {
      aviso.textContent = "O código tem 8 caracteres.";
      return;
    }
    try {
      const ref = doc(db, "pareamentos", c);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        aviso.textContent = "Código não encontrado.";
        return;
      }
      const d = snap.data();
      const idade = Date.now() - d.criadoEm.toMillis();
      if (idade > 10 * 60 * 1000) {
        await deleteDoc(ref);
        aviso.textContent = "Código expirado. Gere outro no app.";
        return;
      }
      await setDoc(doc(db, "dispositivos", d.deviceUid), {
        donoUid: user.uid,
        nome: String(d.nome || "Aparelho").slice(0, 60),
        vinculadoEm: serverTimestamp()
      });
      await deleteDoc(ref);
      codigo.value = "";
      aviso.className = "ok";
      aviso.textContent = "Aparelho vinculado.";
      carregarLista(caixa);
    } catch (e) {
      aviso.textContent = "Falha ao vincular. Confira as regras do Firestore.";
    }
  };
  atualizar.onclick = () => carregarLista(caixa);
  sair.onclick = () => signOut(auth);

  mostrar(
    h("h1", {}, "Painel do Cofre"),
    h("div", { class: "cartao" },
      h("small", {}, "Conta: " + user.email),
      h("br"),
      h("small", { class: "mono" }, "UID: " + user.uid),
      h("br"),
      sair),
    h("div", { class: "cartao" },
      h("strong", {}, "Vincular aparelho"),
      h("label", {}, "Código mostrado no app (Segurança → Painel remoto)"),
      codigo, vincular, aviso),
    h("h2", {}, "Aparelhos"),
    atualizar,
    caixa
  );
  carregarLista(caixa);
}

onAuthStateChanged(auth, (user) => {
  if (!user) {
    clearTimeout(ocioso);
    telaLogin("");
    return;
  }
  reiniciarOcioso();
  telaPainel(user);
});
</script>
</body>
  </html>
